/**:
  ros__parameters:
    log_data: True
    print_performance: False
  
/pupil_glasses_node:
  ros__parameters:
    image_scale: 0.5
    publish_freq: 50
    draw_circle: true
    camera_depth: 1.0
    ip: "10.0.0.2"
    port: "8080"

        
/aruco_detector:
  ros__parameters:
        aruco_dict : "DICT_4X4_250"
        marker_size : 0.060
        camera_frame : "camera_optical_frame" 
        publish_tf : True
        publish_poses : False
        marker_persistence : 0.9
        filter_min_cutoff : 0.5 
        filter_beta : 0.00005  

/button_finder:
  ros__parameters:
        button_center_strategy : "inverse_square"
        button_map_path : "src/diegetic_transform_engine/button_maps/ButtonMap - O-Joy V3.csv"
        # button_frame_id : "button_frame"

/command_mapper_node:
  ros__parameters:
    axis_threshold: 0.3
    debounce_time: 0.3
    parser_mappings_file: "EMANUEL_mode_config.inputs.yaml"

/dwell_time:
  ros__parameters:
    interaction_mode: "dwell_time" #  "immediate"  # Activate immediately on hover
    dwell_duration_seconds: 0.70
    activation_threshold : 0.3
    hover_threshold : 0.1
    deactivation_threshold : 0.3
    processing_mode: 'gaze_driven'
    processing_frequency : 30 
    button_timeout_seconds: 0.9
    publish_debug_image: False
    verbose_logging: False


/gaze_controller_node:
  ros__parameters:
    compensation_active : False
    use_temporal_alignment : True
    sticky_button_interaction : False
    history_length_s : 10.0
    internal_pipeline_delay_ms : -16.66
    median_window : 10
    ema_alpha : 1.0
    edge_margin : 15 # px
    start_trim_ms : 300.0   # Start Padding 
    terminal_trim_ms : 360.0  # End padding 
    min_event_duration_ms : 40.0 #  
    max_gap_ms: 300.0

    max_compensation_px : 120.0

    viz_enabled : False # Only change this one
    viz_show_raw : True
    viz_show_corrected : True
    viz_show_history : False
    viz_show_buttons : True
    viz_show_all_buttons : True
    viz_show_vectors : False
    viz_show_field : False

/calibration_learner_node:
  ros__parameters:

    # Selection and switching logic
    selection_strategy: "RMSE"  # "BIC" or "RMSE"
    cv_strategy:      "kfolds_spatial_block"       # "stratified", "spatial_block", "kfolds_spatial_block"
    n_folds: 5
    spatial_val_ratio: 0.2
    cv_include_diagonals: True
    retrain_on_full_data: True

    # Regressor settings
    solver: "ridge"  # "huber", "ridge", "linear"
    solver_alpha: 10.0 
    bic_hysteresis: 3.0  # Threshold to switch models
    rmse_hysteresis: 1.0

    policy: "original_coupled"     # "original_coupled", "decoupled_shared", "fully_decoupled"
    error_log_filename: "gaze_error_log.csv"

    joy_userstop_button_index: 10  # For recording, default to 'A' or 'X' button
    joy_resume_button_index: 0  # Xbox 'A' button is typically index 0

    publish_data_quiver : True
    publish_status_profile: True
    publish_prediction_map: True
    publish_tournament: True

    # show_binned_truth: True
    # show_prediction : True
    # show_raw_samples : True
    publish_debug_image : False

